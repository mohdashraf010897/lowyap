name: "lowyap-pages"

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/lowyap-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lowyap-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'mohdashraf010897/lowyap'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
